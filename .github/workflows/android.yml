
name: Build Sabor & Horta APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Aceitar licenças Android
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Instalar Android SDK
        run: |
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar aplicativo
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Sabor-Horta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
